name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm -r typecheck
      - run: pnpm --filter @bllt/shared test
      - run: pnpm --filter @bllt/worker test
      - run: pnpm --filter @bllt/web build
      - run: pnpm --filter @bllt/site build
