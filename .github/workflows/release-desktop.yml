name: Release desktop

# Builds the Windows NSIS installer and publishes it to GitHub Releases (via gh, see below).
# electron-updater reads those releases (with blockmaps for differential downloads).
# Before that, the changelog job commits CHANGELOG.md and the site's /novedades data
# to main (Workers Builds redeploys the site) and hands the version's notes to the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Generate changelog
        run: node scripts/changelog.mjs --notes "$GITHUB_REF_NAME" release-notes.md
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: release-notes.md
      - name: Commit to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md apps/site/src/lib/changelog.json
          git diff --cached --quiet && exit 0
          git commit -m "Changelog de $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main

  windows:
    needs: changelog
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes
      - run: pnpm install --frozen-lockfile
      - name: Sync version with tag
        shell: bash
        run: |
          cd apps/desktop
          npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: pnpm build && pnpm exec electron-builder --win --publish never
      # electron-builder uploads assets in parallel and, on a fresh tag, each upload can create
      # its own release (duplicates with the .exe split from latest.yml). One release, then upload.
      # latest.yml goes last so electron-updater never sees it before the installer exists.
      - name: Publish release
        working-directory: apps/desktop
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" dist/Bllt-*-setup.exe dist/Bllt-*-setup.exe.blockmap
          gh release upload "$GITHUB_REF_NAME" dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
