name: Release desktop

# Builds the Windows NSIS installer and publishes it to GitHub Releases.
# electron-updater reads those releases (with blockmaps for differential downloads).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync version with tag
        shell: bash
        run: |
          cd apps/desktop
          npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build and publish
        working-directory: apps/desktop
        run: pnpm build && pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
